# Curated dependency list for the calcium-ar project — the human-readable
# "source of truth" for what this project needs, pinned to the versions it was
# developed and validated with.
#
# Two files, two jobs:
#   environment.yml       (this file)  — short, readable, what we depend on.
#   environment.lock.yml  (generated)  — full byte-exact snapshot for an
#                                        identical rebuild. Prefer it on HPC.
#
# Create the env:   conda env create -f environment.yml
# Activate:         conda activate phd_conda
# Refresh the lock: conda env export -n phd_conda | grep -v '^prefix:' > environment.lock.yml
#
# NOTE — PyTorch is intentionally NOT listed below. It is only needed for the
# torch_* solvers, and the build differs per machine (CPU vs GPU). Install it
# as a separate step after creating the env:
#   CPU (laptop / CPU cluster jobs):
#     pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
#   GPU (NEMO2 GPU nodes — match the CUDA toolkit available there):
#     pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cu121

name: phd_conda
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.7
  - pip

  # --- simulation engine (conda-forge only; not on PyPI) ---
  - nest-simulator=3.8
  - openmpi=5.0.5            # NEST's MPI / threading backend

  # --- numerical core ---
  - numpy=2.1.2
  - scipy=1.14.1
  - scikit-learn=1.5.2

  # --- IO / storage ---
  - h5py=3.11.0
  - zarr=2.18.3
  - numcodecs=0.14.0

  # --- experiment records ---
  - pandas=2.2.3
  - joblib=1.4.2

  # --- HPC parallelism ---
  - dask=2024.9.1
  - dask-jobqueue=0.9.0

  # --- analysis / graph ---
  - networkx=3.2.1
  - statsmodels=0.14.4
  - python-louvain=0.15

  # --- plotting ---
  - matplotlib-base=3.9.2
  - seaborn=0.13.2
