[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "calcium-ar"
version = "0.1.0"
description = "Brunel-network simulation, calcium signal generation, and connectivity inference via AR models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "h5py>=3.10",
    "zarr>=2.18",
]

[project.optional-dependencies]
hpc = ["dask>=2024.1", "dask-jobqueue>=0.9"]
gpu = ["torch>=2.2"]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["calcium_ar*"]
